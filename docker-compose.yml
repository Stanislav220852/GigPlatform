version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gig_postgis_db
    restart: always
    environment:
      POSTGRES_USER: gig_user
      POSTGRES_PASSWORD: gig_password
      POSTGRES_DB: gig_platform_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gig_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: