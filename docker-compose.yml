version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gig_postgis_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gig_network

  redis:
    image: redis:7-alpine
    container_name: gig_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - gig_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: gig_pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - gig_network
    depends_on:
      - db

volumes:
  pgdata:
  redis_data:
  pgadmin_data:

networks:
  gig_network:
    driver: bridge